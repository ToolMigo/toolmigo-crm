name: Bouw en publiceer ToolMigo CRM

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v6

      - name: Image-naam bepalen
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Multi-architectuur inschakelen
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx instellen
        uses: docker/setup-buildx-action@v3

      - name: Aanmelden bij GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker-image bouwen en publiceren
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:1.1.0
          labels: |
            org.opencontainers.image.title=ToolMigo CRM
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
