{% load static %}<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificatie · ToolMigo CRM</title><link rel="stylesheet" href="{% static 'css/app.css' %}"></head><body class="login-page"><main class="login-shell"><section class="login-intro"><div class="brand light"><img src="{% static 'img/toolmigo-logo.jpeg' %}" alt=""><span>Tool<strong>migo</strong><small>CRM</small></span></div><div><span class="eyebrow">EXTRA BEVEILIGING</span><h1>Controleer je identiteit.</h1><p>Open je authenticator-app en vul de actuele code in.</p></div></section><section class="login-form"><div class="form-wrap"><span class="eyebrow">TWEEDE STAP</span><h2>Verificatiecode</h2>{% if messages %}{% for message in messages %}<div class="form-error">{{ message }}</div>{% endfor %}{% endif %}<form method="post">{% csrf_token %}<label for="code">Authenticator- of herstelcode</label><input id="code" name="code" required autofocus autocomplete="one-time-code"><input type="hidden" name="next" value="{{ request.GET.next }}"><button class="btn primary full">Veilig inloggen</button></form></div></section></main></body></html>
